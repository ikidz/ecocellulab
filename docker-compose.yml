services:
  ecocellulab-dev-app:
    container_name: ecocellulab-dev-app
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: ["/start.sh"]
    volumes:
      - ./laravel:/var/www/html
    depends_on:
      - ecocellulab-dev-db
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_CONNECTION=mysql
      - DB_HOST=ecocellulab-dev-db
      - DB_PORT=3306
      - DB_DATABASE=ecocellulab_db
      - DB_USERNAME=ecocellulab_user
      - DB_PASSWORD=ecocellulab_password
    ports:
      - "8080:80"
      - "5173:5173"

  ecocellulab-dev-db:
    container_name: ecocellulab-dev-db
    image: mysql:8
    restart: always
    ports:
      - "9906:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ecocellulab_db
      MYSQL_USER: ecocellulab_user
      MYSQL_PASSWORD: ecocellulab_password
    volumes:
      - ./db_data:/var/lib/mysql
